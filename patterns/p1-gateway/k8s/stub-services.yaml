---
# Stub ClusterIP Services for Pattern 1.
# Each Service selects the shared WireMock pod (app=wiremock) so that
# lb://order, lb://payment, etc. all resolve to the WireMock deployment.
# In later patterns these will be replaced by real service deployments.

apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: reboot-patterns
  labels:
    pattern: p1
spec:
  selector:
    app: wiremock
  ports:
    - port: 8080
      targetPort: 8080

