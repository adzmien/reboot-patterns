spring.application.name=p1-gateway
server.port=8080

spring.cloud.kubernetes.namespace=reboot-patterns
spring.cloud.kubernetes.discovery.all-namespaces=false
# Use service ClusterIP for routing rather than pod endpoint IPs.
# Pod-to-pod direct routing is unreliable in this K3s setup; ClusterIP is stable.
spring.cloud.kubernetes.discovery.use-endpoint-slices=false
spring.cloud.kubernetes.loadbalancer.mode=SERVICE

spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s

management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true

logging.config=classpath:logback-spring.xml
