// Root build file — applies shared config to every pattern subproject.
// The Spring Boot and dependency-management plugins are declared here so
// the version catalog entry is the single source of truth, but they are
// NOT applied at root level (apply false). Each subproject opts in when needed.

plugins {
    id 'org.springframework.boot'       version '3.5.3' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    // Every pattern subproject is a plain Java 21 project.
    apply plugin: 'java'

    // Pin the compiler to Java 21 via toolchains so the JDK in use does not matter.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    // Lombok is applied globally — every subproject gets it for free.
    // Subprojects that also use MapStruct add mapstruct-processor in their own build.gradle.
    dependencies {
        compileOnly     libs.lombok
        annotationProcessor libs.lombok
        testCompileOnly     libs.lombok
        testAnnotationProcessor libs.lombok
    }
}
