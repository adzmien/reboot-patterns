apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: reboot-patterns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: redis-password
          # vanilla redis:7.4 only enforces auth when --requirepass is passed as a CLI arg;
          # the REDIS_PASSWORD env var alone does nothing without it.
          args:
            - "--appendonly"
            - "yes"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
