# NodePort service: exposes Grafana UI at http://<node-ip>:30030 for browser access and curl checks.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: reboot-patterns
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30030
