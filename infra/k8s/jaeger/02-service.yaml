---
# NodePort service: exposes the Jaeger UI at http://<node-ip>:30686 for browser access.
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: reboot-patterns
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 30686

---
# ClusterIP service: exposes Jaeger's OTLP gRPC port inside the cluster so the OTel Collector
# can export spans without going through a NodePort.
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: reboot-patterns
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
