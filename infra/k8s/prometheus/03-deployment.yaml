apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: reboot-patterns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # Use the ServiceAccount created in 01-rbac.yaml so Kubernetes SD can call the API server.
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.3.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            # Store data in a well-known path; no PVC needed for this learning environment.
            - "--storage.tsdb.path=/prometheus"
            # Short retention keeps the pod lightweight.
            - "--storage.tsdb.retention.time=7d"
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
